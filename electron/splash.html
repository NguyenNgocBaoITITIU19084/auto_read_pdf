<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Auto Read PDF Pro</title>
<style>
  :root {
    --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --accent: #2563eb; --track: #e2e8f0;
    --card: #ffffff; --border: #e2e8f0; --danger: #dc2626;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #020617; --fg: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6; --track: #1e293b;
            --card: #0f172a; --border: #1e293b; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    -webkit-user-select: none; user-select: none;
  }
  .wrap { text-align: center; max-width: 560px; width: 100%; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: var(--accent); margin: 0 auto 18px;
          display: flex; align-items: center; justify-content: center; }
  .logo i { display: block; width: 24px; height: 30px; border-radius: 4px; background: #fff; position: relative; }
  .logo i::after { content: ""; position: absolute; left: 5px; right: 5px; top: 8px; height: 3px; border-radius: 2px;
                   background: var(--accent); box-shadow: 0 6px 0 var(--accent), 0 12px 0 var(--accent); }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 22px; letter-spacing: .2px; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
             border: 3px solid var(--track); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { color: var(--muted); min-height: 21px; }
  #error { display: none; text-align: left; background: var(--card); border: 1px solid var(--border);
           border-radius: 12px; padding: 18px 20px; }
  #error h2 { color: var(--danger); font-size: 15px; margin: 0 0 8px; }
  #error p { margin: 0 0 10px; }
  code { display: block; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all;
         background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
         -webkit-user-select: text; user-select: text; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 8px; padding: 7px 16px; cursor: pointer; border: 1px solid var(--border);
           background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  body.failed .spinner, body.failed #status { display: none; }
  body.failed #error { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><i></i></div>
    <h1>Auto Read PDF Pro</h1>
    <div class="spinner"></div>
    <div id="status">Đang khởi động...</div>
    <div id="error">
      <h2>Không thể khởi động dịch vụ xử lý dữ liệu</h2>
      <p id="error-message"></p>
      <p>File log:</p>
      <code id="log-path"></code>
      <div class="actions">
        <button class="primary" id="retry">Thử lại</button>
        <button id="open-log">Mở file log</button>
      </div>
    </div>
  </div>
<script>
  (function () {
    var api = window.electronAPI || {};
    window.setStatus = function (text) {
      document.body.classList.remove('failed');
      document.getElementById('status').textContent = text || '';
      document.getElementById('retry').disabled = false;
    };
    window.showError = function (message, logPath) {
      document.getElementById('error-message').textContent = message || '';
      document.getElementById('log-path').textContent = logPath || '';
      document.body.classList.add('failed');
      document.getElementById('retry').disabled = false;
    };
    document.getElementById('retry').addEventListener('click', function () {
      this.disabled = true;
      window.setStatus('Đang thử khởi động lại...');
      if (api.retryBackend) api.retryBackend();
    });
    document.getElementById('open-log').addEventListener('click', function () {
      if (api.showBackendLog) api.showBackendLog();
    });
  })();
</script>
</body>
</html>
