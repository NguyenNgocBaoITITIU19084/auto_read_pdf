name: Build & Package Desktop Apps (Mac & Win)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Queue runs on the same ref instead of running two releases of one version at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================
  # 1. Build macOS Application (DMG & ZIP)
  # ==========================================================
  build-macos:
    name: Build macOS (Universal / DMG & ZIP)
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Backend Unit Tests
        run: pytest tests/

      - name: 📦 Install Root & Frontend Node Dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: 🏗️ Build Frontend Web Bundle
        run: npm run build:frontend

      - name: 🐍 Build Standalone Python Backend Executable
        run: |
          export PYINSTALLER_CONFIG_DIR="$(pwd)/.pyinstaller_cache"
          pyinstaller backend_app.spec --noconfirm --clean

      - name: ⚡ Package macOS App with Electron Builder
        run: npx electron-builder --mac --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoReadPDF-MacOS
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
          if-no-files-found: error

  # ==========================================================
  # 2. Build Windows Application (Installer & Portable EXE)
  # ==========================================================
  build-windows:
    name: Build Windows (NSIS Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Backend Unit Tests
        run: pytest tests/

      - name: 📦 Install Root & Frontend Node Dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: 🏗️ Build Frontend Web Bundle
        run: npm run build:frontend

      - name: 🐍 Build Standalone Python Backend Executable
        run: |
          pyinstaller backend_app.spec --noconfirm --clean

      - name: ⚡ Package Windows App with Electron Builder
        run: npx electron-builder --win --x64 --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoReadPDF-Windows
          path: |
            dist_electron/*.exe
            dist_electron/*.exe.blockmap
            dist_electron/latest.yml
          if-no-files-found: error

  # ==========================================================
  # 3. Automatic GitHub Release
  #    A push to main whose package.json version has no release yet publishes
  #    v<version> (creating the tag if needed). electron-updater on Windows reads
  #    latest.yml from that release, so no manual tag push is required.
  # ==========================================================
  release:
    name: Publish GitHub Release & Direct Download Links
    needs: [build-macos, build-windows]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔎 Check whether this version is already released
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download macOS Artifacts
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: AutoReadPDF-MacOS
          path: release_assets/

      - name: 📥 Download Windows Artifacts
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: AutoReadPDF-Windows
          path: release_assets/

      - name: 🚀 Publish Direct Download Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          files: release_assets/**/*
          draft: false
          prerelease: false
          make_latest: 'true'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
