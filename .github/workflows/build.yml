name: Build & Package Desktop Apps (Mac & Win)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================================
  # 1. Build macOS Application (DMG & ZIP)
  # ==========================================================
  build-macos:
    name: Build macOS (Universal / DMG & ZIP)
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Backend Unit Tests
        run: pytest tests/

      - name: 📦 Install Root & Frontend Node Dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: 🏗️ Build Frontend Web Bundle
        run: npm run build:frontend

      - name: 🐍 Build Standalone Python Backend Executable
        run: |
          export PYINSTALLER_CONFIG_DIR="$(pwd)/.pyinstaller_cache"
          pyinstaller backend_app.spec --noconfirm --clean

      - name: ⚡ Package macOS App with Electron Builder
        run: npx electron-builder --mac --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoReadPDF-MacOS
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
          if-no-files-found: error

  # ==========================================================
  # 2. Build Windows Application (Installer & Portable EXE)
  # ==========================================================
  build-windows:
    name: Build Windows (NSIS Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Backend Unit Tests
        run: pytest tests/

      - name: 📦 Install Root & Frontend Node Dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: 🏗️ Build Frontend Web Bundle
        run: npm run build:frontend

      - name: 🐍 Build Standalone Python Backend Executable
        run: |
          pyinstaller backend_app.spec --noconfirm --clean

      - name: ⚡ Package Windows App with Electron Builder
        run: npx electron-builder --win --x64 --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoReadPDF-Windows
          path: |
            dist_electron/*.exe
            dist_electron/*.exe.blockmap
            dist_electron/latest.yml
          if-no-files-found: error

  # ==========================================================
  # 3. Automatic GitHub Release / Pre-Release Download
  # ==========================================================
  release:
    name: Publish GitHub Release & Direct Download Links
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AutoReadPDF-MacOS
          path: release_assets/

      - name: 📥 Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AutoReadPDF-Windows
          path: release_assets/

      - name: 🚀 Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release_assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
